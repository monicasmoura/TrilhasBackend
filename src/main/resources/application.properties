spring.application.name=trilhas.api

spring.datasource.url=jdbc:h2:file:./data/trilhas
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

springdoc.swagger-ui.path=/swagger


springdoc.swagger-ui.doc-expansion=
springdoc.swagger-ui.default-models-expand-depth=-1
springdoc.swagger-ui.default-model-expand-depth=-1
springdoc.swagger-ui.display-request-duration=false
springdoc.swagger-ui.show-extensions=false
springdoc.swagger-ui.show-common-extensions=false